<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>불빛 하나 — 실행 로그</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">《불빛 하나》 <span>내집마련 대출 플래너</span></div>
    <nav><a href="index.html">대화</a><a href="plans.html">계획 관리</a><a href="logs.html" class="active">실행 로그</a></nav>
  </header>
  <main>
    <div class="grid">
      <section class="panel">
        <h2>세션 목록 <button class="ghost" id="refresh" type="button">새로고침</button></h2>
        <p class="muted">로깅 Agent 가 저장한 기록입니다. 기록은 고칠 수 없고 조회·삭제만 됩니다.</p>
        <table>
          <thead><tr><th>세션</th><th>첫 질문</th><th>턴</th><th>Tool</th><th>재계획</th><th>실패</th><th></th></tr></thead>
          <tbody id="sessions"></tbody>
        </table>
      </section>
      <section class="panel">
        <h2>상세 <span class="muted" id="detail-meta"></span></h2>
        <ol class="timeline" id="events"><li class="muted">왼쪽에서 세션을 고르세요.</li></ol>
      </section>
    </div>
  </main>
  <footer class="notices">
    <p>본 서비스는 정보 제공용이며 금융 전문가의 조언을 대신하지 않습니다. 실제 금리·한도는 금융회사 심사로 정해집니다.</p>
    <p>상품 정보는 금융상품통합비교공시시스템(금융감독원) 금융회사 상품정보를 사용한 결과이며, 금융감독원은 정보의 정확성·최신성을 보증하지 않습니다.</p>
  </footer>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="logs.js"></script>
</body>
</html>
